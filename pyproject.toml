[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnfind"
version = "3.0.0"
description = "Zero-dependency security scanner for code, websites, container images and cloud: CVEs with exploit intel and reachability, cross-file data-flow analysis, secrets, IaC and DAST."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "cve", "sast", "dast", "secrets", "sbom", "osv", "scanner", "web"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
ai = ["anthropic"]  # only for `vulnfind ai`; everything else is dependency-free

[project.urls]
Homepage = "https://github.com/codingsushi79/vulnfind"
Issues = "https://github.com/codingsushi79/vulnfind/issues"

[project.scripts]
vulnfind = "vulnfind.cli:main"

[tool.setuptools.packages.find]
include = ["vulnfind*"]

[tool.setuptools.package-data]
"vulnfind.bench" = ["cases/*", "cases/.*"]
