name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # uv's standalone builds still cover 3.8/3.9, which setup-python no longer ships for current Ubuntu images
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Unit tests (no third-party dependencies)
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vulnfind scans itself
        run: python -m vulnfind . --fail-on medium --no-progress -o self.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: self.sarif

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Precision / recall on the labelled corpus
        run: python -m vulnfind bench --min-recall 0.9 --min-precision 0.9
      - name: Smoke-scan well-known vulnerable apps (informational)
        continue-on-error: true
        run: |
          for repo in OWASP/NodeGoat juice-shop/juice-shop WebGoat/WebGoat digininja/DVWA; do
            git clone --depth 1 -q "https://github.com/$repo" "/tmp/$(basename $repo)"
            python -m vulnfind "/tmp/$(basename $repo)" --offline --no-progress --fail-on none -f json \
              | python -c "import json,sys; d=json.load(sys.stdin)['summary']; print('$repo', d['counts'], d['grade'])"
          done
