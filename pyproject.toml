[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnfind"
version = "2.1.0"
description = "Zero-dependency security scanner for code and websites: CVEs with exploit intel, secrets, data-flow analysis, IaC/CI checks and web (DAST) scanning."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "cve", "sast", "dast", "secrets", "sbom", "osv", "scanner", "web"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/codingsushi79/vulnfind"
Issues = "https://github.com/codingsushi79/vulnfind/issues"

[project.scripts]
vulnfind = "vulnfind.cli:main"

[tool.setuptools.packages.find]
include = ["vulnfind*"]
