# Publishes to PyPI when a GitHub release is published.
# One-time setup: on pypi.org add a "trusted publisher" for this repo and workflow
# (owner codingsushi79, repo vulnfind, workflow publish.yml, environment pypi).
name: publish
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI trusted publishing - no API token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: python -m unittest discover -s tests
      - name: Build and publish
        run: |
          python -m pip install --upgrade uv
          uv build
          uv publish --trusted-publishing always
